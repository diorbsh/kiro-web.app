name: Deploy to Pages

# Veröffentlicht die App auf GitHub Pages.
#
# EINMALIGE VORAUSSETZUNG:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Ohne diese Einstellung schlägt der Schritt "configure-pages" fehl
# ("Get Pages site failed"). Das Einschalten per API ist dem Actions-Token nicht
# erlaubt, deshalb bleibt es ein manueller Klick. Die Code-Prüfung läuft davon
# unabhängig im Workflow "CI".
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        run: npm install

      # Muss vor dem Build laufen: liefert den Basis-Pfad der Pages-Site.
      - uses: actions/configure-pages@v5

      - name: Build
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
